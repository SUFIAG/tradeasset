services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeasset-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tradeasset}
      POSTGRES_USER: ${DB_USERNAME:-tradeasset}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tradeasset_local}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [tradeasset]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tradeasset} -d ${DB_NAME:-tradeasset}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeasset-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [tradeasset]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tradeasset-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tradeasset}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tradeasset_local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [tradeasset]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Creates the documents bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: tradeasset-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [tradeasset]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-tradeasset} ${MINIO_SECRET_KEY:-tradeasset_local} &&
      mc mb --ignore-existing local/tradeasset-documents &&
      mc anonymous set none local/tradeasset-documents
      "

networks:
  tradeasset:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
