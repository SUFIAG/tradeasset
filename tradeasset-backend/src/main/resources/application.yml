# TradeAsset backend configuration.
#
# No secret has a default here (REQ-SEC-009). Local development values live in the "dev" profile
# below and are only safe on a developer machine. The "prod" profile refuses to start when
# JWT_SECRET, DB_PASSWORD or the storage credentials are absent (ProductionSecretsValidator).

spring:
  application:
    name: tradeasset

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradeasset}
    username: ${DB_USERNAME:tradeasset}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: SYSTEM_ADMIN
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1

logging:
  level:
    root: WARN
    com.tradesphere.ai: INFO
    org.springframework.boot: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

tradesphere:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: tradeasset
      access-token-ttl: PT15M      # REQ-SEC-003
      refresh-token-ttl: P7D       # REQ-SEC-003
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login:
      max-failed-attempts: 5       # REQ-SEC-005
      lockout-duration: PT30M
      captcha-after-failures: 3
    password-reset:
      token-ttl: PT30M             # REQ-IDN-004
      reset-url-base: ${PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}
    mfa:
      issuer: TradeAsset
      expose-otp-in-response: false

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket-name: ${MINIO_BUCKET:tradeasset-documents}

  document:
    max-size-bytes: 52428800       # REQ-DOC-002
    scanning:
      clamav-host: ${CLAMAV_HOST:}
      clamav-port: ${CLAMAV_PORT:3310}
      allow-unscanned: false       # REQ-DOC-003: never true outside dev

  ai:
    provider: ${AI_PROVIDER:none}  # none | anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
      base-url: https://api.anthropic.com
    timeout: PT30S                 # REQ-NFR-002
    thresholds:
      auto-fill: 0.85              # REQ-AI-003
      show-with-warning: 0.50

  business:
    kyc:
      validity-months: 12          # REQ-CUS-004
      required-documents: TRADE_LICENSE,BOARD_RESOLUTION,SIGNATORY_PASSPORT,PROOF_OF_ADDRESS
    lc:
      default-presentation-days: 21  # REQ-LC-005
      refusal-notice-banking-days: 5 # REQ-LC-007
    bg:
      expiry-watch-days: 30        # REQ-BG-008
    scf:
      due-soon-days: 7             # REQ-SCF-006

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: ${DB_USERNAME:tradeasset}
    password: ${DB_PASSWORD:tradeasset_local}
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
    # Older local databases were built from since-consolidated scripts; do not block on checksums.
    validate-on-migrate: false

tradesphere:
  security:
    jwt:
      # Development only. Never reuse outside a developer machine.
      secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    mfa:
      # Development only: returns e-mail one-time codes in the API response because no SMTP server
      # runs locally. The prod profile refuses to start with this enabled.
      expose-otp-in-response: true
  storage:
    minio:
      access-key: ${MINIO_ACCESS_KEY:tradeasset}
      secret-key: ${MINIO_SECRET_KEY:tradeasset_local}
  document:
    scanning:
      # Development only: no ClamAV locally. Files are stored with scan status NOT_SCANNED.
      allow-unscanned: true

logging:
  level:
    com.tradesphere.ai: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.tradesphere.ai: INFO
